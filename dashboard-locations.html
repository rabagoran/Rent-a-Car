<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations | Dashboard | RentACar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard">

        <!-- Menuja anash -->
        <aside class="sidebar">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="dashboard.html">Overview</a></li>
                <li><a href="dashboard-cars.html">Cars</a></li>
                <li><a href="dashboard-add-car.html">Add car</a></li>
                <li><a href="dashboard-reservations.html">Reservations</a></li>
                <li><a href="dashboard-clients.html">Clients</a></li>
                <li><a class="active" href="dashboard-locations.html">Locations</a></li>
            </ul>
            <ul class="logout">
                <li><a href="index.html">Back to site</a></li>
                <li><a href="login.html">Log out</a></li>
            </ul>
        </aside>

        <!-- Permbajtja -->
        <main class="content">
            <div class="top-bar">
                <div>
                    <h1>Locations</h1>
                    <p>Pick-up and drop-off points.</p>
                </div>
            </div>

            <!-- Lokacionet do te shfaqen ketu kur te lidhet databaza -->
            <div class="panel">
                <table>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>City</th>
                        <th>Address</th>
                        <th>Phone</th>
                    </tr>
                    <tr>
                        <td class="empty" colspan="5">No locations yet.</td>
                    </tr>
                </table>
            </div>

            <!-- Forma per lokacion te ri -->
            <div class="panel">
                <h2>Add location</h2>
                <form class="form-box" action="dashboard-locations.html">
                    <div class="form-row">
                        <label>Name
                            <input type="text" name="name" placeholder="Zyra Qendrore" required>
                        </label>
                        <label>City
                            <input type="text" name="city" placeholder="Prishtinë" required>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>Address
                            <input type="text" name="address">
                        </label>
                        <label>Phone
                            <input type="tel" name="phone">
                        </label>
                    </div>
                    <button class="btn" type="submit">Save location</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
