<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a car | RentACar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cars.html">Cars</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="terms.html">Rental terms</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a class="btn-nav" href="booking.html">Book a car</a></li>
            </ul>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <p class="breadcrumb"><a href="index.html">Home</a> / Book a car</p>
            <h1>Book a car</h1>
            <p>Choose a car, location and dates.</p>
        </div>
    </div>

    <section>
        <form class="form-box wide" method="post" action="/api/bookings">
            <p class="message" id="message"></p>

            <!-- Veturat dhe lokacionet mbushen nga databaza (js/booking.js) -->
            <label>Car
                <select name="car_id" id="car-select" required></select>
            </label>
            <!-- Datat kur vetura eshte e zene (js/booking.js) -->
            <p class="booked" id="booked-dates"></p>
            <label>Pick-up location
                <select name="location_id" id="location-select" required></select>
            </label>
            <div class="form-row">
                <label>Pick-up date
                    <input type="date" name="start_date" id="start-date" required>
                </label>
                <label>Return date
                    <input type="date" name="end_date" id="end-date" required>
                </label>
            </div>

            <!-- Cmimi llogaritet me JS: ditet x cmimi per dite -->
            <div class="summary">
                <p><span>Price per day</span> <strong id="price-day">-</strong></p>
                <p><span>Days</span> <strong id="days">-</strong></p>
                <p><span>Total</span> <strong id="total">€0</strong></p>
            </div>

            <label class="checkbox">
                <input type="checkbox" required> I agree to the <a href="terms.html">rental terms</a>
            </label>
            <button class="btn" type="submit">Send reservation</button>
        </form>
    </section>

    <footer>
        <div class="container footer-inner">
            <span>© 2026 RentACar</span>
            <span>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Rental terms</a>
                <a href="photo-credits.html">Photo credits</a>
                <a href="dashboard.html">Dashboard</a>
            </span>
        </div>
    </footer>
    <script src="js/helpers.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
