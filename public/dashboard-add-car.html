<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add car | Dashboard | RentACar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard">

        <!-- Menuja anash -->
        <aside class="sidebar">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="dashboard.html">Overview</a></li>
                <li><a href="dashboard-cars.html">Cars</a></li>
                <li><a class="active" href="dashboard-add-car.html">Add car</a></li>
                <li><a href="dashboard-reservations.html">Reservations</a></li>
                <li><a href="dashboard-clients.html">Clients</a></li>
                <li><a href="dashboard-locations.html">Locations</a></li>
            </ul>
            <ul class="logout">
                <li><a href="index.html">Back to site</a></li>
                <li><a href="/api/logout">Log out</a></li>
            </ul>
        </aside>

        <!-- Permbajtja -->
        <main class="content">
            <div class="top-bar">
                <div>
                    <h1 id="form-title">Add car</h1>
                    <p>Fill in the details of the car.</p>
                </div>
                <a class="btn" href="dashboard-cars.html">← Back to cars</a>
            </div>

            <p class="message" id="message"></p>

            <div class="panel">
                <!-- Kur behet Edit, js/dashboard-add-car.js e ndryshon action ne /api/cars/ID -->
                <form class="form-box" id="car-form" method="post" action="/api/cars">
                    <div class="form-row">
                        <label>Brand
                            <input type="text" name="brand" placeholder="Toyota" required>
                        </label>
                        <label>Model
                            <input type="text" name="model" placeholder="Yaris" required>
                        </label>
                    </div>
                    <div class="form-row">
                        <!-- Kategorite dhe lokacionet mbushen nga databaza -->
                        <label>Category
                            <select name="category_id" id="category-select" required></select>
                        </label>
                        <label>Location
                            <select name="location_id" id="location-select" required></select>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>Year
                            <input type="number" name="year" min="1990" max="2100" placeholder="2024" required>
                        </label>
                        <label>Plate number
                            <input type="text" name="plate" placeholder="01-123-AB">
                        </label>
                    </div>
                    <div class="form-row">
                        <label>Seats
                            <input type="number" name="seats" min="2" max="9" value="5" required>
                        </label>
                        <label>Transmission
                            <select name="transmission">
                                <option value="AUTOMATIC">Automatic</option>
                                <option value="MANUAL">Manual</option>
                            </select>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>Fuel
                            <select name="fuel_type">
                                <option value="PETROL">Petrol</option>
                                <option value="DIESEL">Diesel</option>
                                <option value="HYBRID">Hybrid</option>
                                <option value="ELECTRIC">Electric</option>
                            </select>
                        </label>
                        <label>Price per day (€)
                            <input type="number" name="price" min="1" step="0.01" placeholder="35" required>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>Status
                            <select name="status">
                                <option value="AVAILABLE">Available</option>
                                <option value="RENTED">Rented</option>
                                <option value="MAINTENANCE">Maintenance</option>
                            </select>
                        </label>
                        <label>Image
                            <input type="text" name="image" placeholder="images/cars/toyota-yaris.jpg">
                        </label>
                    </div>
                    <button class="btn" id="save-button" type="submit">Save car</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/helpers.js"></script>
    <script src="js/dashboard-add-car.js"></script>
</body>
</html>
