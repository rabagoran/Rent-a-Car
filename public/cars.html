<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars | RentACar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="cars.html">Cars</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="terms.html">Rental terms</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a class="btn-nav" href="booking.html">Book a car</a></li>
            </ul>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <p class="breadcrumb"><a href="index.html">Home</a> / Cars</p>
            <h1>Our cars</h1>
            <p>Choose the car that fits your trip.</p>
        </div>
    </div>

    <section>
        <div class="container">
            <!-- Filtrat: forma dergon te dhenat ne adrese (?category=...), js/cars.js i lexon -->
            <form class="filters" id="filter-form" action="cars.html">
                <label>Pick-up location
                    <select name="location" id="location-filter">
                        <option value="">Any location</option>
                    </select>
                </label>
                <label>Pick-up date
                    <input type="date" name="from">
                </label>
                <label>Return date
                    <input type="date" name="to">
                </label>
                <label>Category
                    <select name="category" id="category-filter">
                        <option value="">All categories</option>
                    </select>
                </label>
                <label>Transmission
                    <select name="transmission">
                        <option value="">Any</option>
                        <option value="AUTOMATIC">Automatic</option>
                        <option value="MANUAL">Manual</option>
                    </select>
                </label>
                <label>Fuel
                    <select name="fuel">
                        <option value="">Any</option>
                        <option value="PETROL">Petrol</option>
                        <option value="DIESEL">Diesel</option>
                        <option value="HYBRID">Hybrid</option>
                        <option value="ELECTRIC">Electric</option>
                    </select>
                </label>
                <label>Max price / day
                    <input type="number" name="max_price" min="1" placeholder="€ any">
                </label>
                <div class="filter-buttons">
                    <button class="btn" type="submit">Search</button>
                    <a class="btn btn-outline" href="cars.html">Clear</a>
                </div>
            </form>

            <p class="results" id="results-count"></p>

            <!-- Veturat vijne nga databaza (js/cars.js) -->
            <div class="cars" id="car-list"></div>
        </div>
    </section>

    <footer>
        <div class="container footer-inner">
            <span>© 2026 RentACar</span>
            <span>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Rental terms</a>
                <a href="photo-credits.html">Photo credits</a>
                <a href="dashboard.html">Dashboard</a>
            </span>
        </div>
    </footer>
    <script src="js/helpers.js"></script>
    <script src="js/cars.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
