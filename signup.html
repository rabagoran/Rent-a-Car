<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | RentACar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cars.html">Cars</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="terms.html">Rental terms</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a class="active" href="login.html">Log in</a></li>
                <li><a class="btn-nav" href="booking.html">Book a car</a></li>
            </ul>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <p class="breadcrumb"><a href="index.html">Home</a> / Sign up</p>
            <h1>Create your account</h1>
            <p>Sign up to keep your rentals in one place.</p>
        </div>
    </div>

    <section>
        <form class="form-box" action="login.html">
            <div class="form-row">
                <label>First name
                    <input type="text" name="first_name" required>
                </label>
                <label>Last name
                    <input type="text" name="last_name" required>
                </label>
            </div>
            <label>Email
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>
            <label>Phone
                <input type="tel" name="phone">
            </label>
            <label>Password
                <input type="password" name="password" minlength="8" required>
            </label>
            <label class="checkbox">
                <input type="checkbox" required> I agree to the <a href="terms.html">rental terms</a>
            </label>
            <button class="btn" type="submit">Create account</button>
            <p class="form-link">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </section>

    <footer>
        <div class="container footer-inner">
            <span>© 2026 RentACar</span>
            <span>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Rental terms</a>
                <a href="photo-credits.html">Photo credits</a>
                <a href="dashboard.html">Dashboard</a>
            </span>
        </div>
    </footer>
</body>
</html>
