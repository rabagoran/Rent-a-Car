<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | Dashboard | RentACar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard">

        <!-- Menuja anash -->
        <aside class="sidebar">
            <a class="logo" href="index.html">Rent<span>ACar</span></a>
            <ul>
                <li><a href="dashboard.html">Overview</a></li>
                <li><a href="dashboard-cars.html">Cars</a></li>
                <li><a href="dashboard-add-car.html">Add car</a></li>
                <li><a class="active" href="dashboard-reservations.html">Reservations</a></li>
                <li><a href="dashboard-clients.html">Clients</a></li>
                <li><a href="dashboard-locations.html">Locations</a></li>
            </ul>
            <ul class="logout">
                <li><a href="index.html">Back to site</a></li>
                <li><a href="login.html">Log out</a></li>
            </ul>
        </aside>

        <!-- Permbajtja -->
        <main class="content">
            <div class="top-bar">
                <div>
                    <h1>Reservations</h1>
                    <p>Review requests and update their status.</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <span>All</span>
                    <strong>0</strong>
                </div>
                <div class="stat">
                    <span>Pending</span>
                    <strong>0</strong>
                </div>
                <div class="stat">
                    <span>Confirmed</span>
                    <strong>0</strong>
                </div>
                <div class="stat">
                    <span>Cancelled</span>
                    <strong>0</strong>
                </div>
            </div>

            <!-- Rezervimet do te shfaqen ketu kur te lidhet databaza -->
            <div class="panel">
                <table>
                    <tr>
                        <th>#</th>
                        <th>Client</th>
                        <th>Car</th>
                        <th>Location</th>
                        <th>Pick-up</th>
                        <th>Return</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    <tr>
                        <td class="empty" colspan="9">No reservations yet.</td>
                    </tr>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
